/* 사이트 표시 이름 — 여기만 고치면 됩니다 */
var NAMES = {
  dodotv: '도도티비',
  mimitv: '미미티비',
  tvwiki: '티비위키',
  mvking: '무비킹',
  tvroom: '티비룸',
  tvmon:  '티비몬'
};
(function () {
  var app = document.getElementById('app');
  var key = (location.hash.slice(1) ||
             new URLSearchParams(location.search).get('go') || '').trim().toLowerCase();
  fetch('urls.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (key && data[key] && key.charAt(0) !== '_') { location.replace(key + '/'); return; }
      var html = '<div class="grid">';
      Object.keys(data).filter(function(k){ return k.charAt(0) !== '_'; }).forEach(function(k){
        var mn = data[k].manual || [];
        var sub = mn.length ? mn[0].replace(/^https?:\/\//,'') : '';
        var ic = ICONS[k] ? '<img src="' + ICONS[k] + '" alt="">' : '';
        html += '<a class="site" href="' + k + '/">' + ic +
                '<span class="t"><b>' + (NAMES[k] || k) + '</b><small>' + sub + '</small></span></a>';
      });
      app.innerHTML = html + '</div>';
    })
    .catch(function(){ app.innerHTML = '<div class="msg">주소 정보를 불러오지 못했습니다.</div>'; });
})();
